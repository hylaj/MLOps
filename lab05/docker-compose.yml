services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: mlflow-server
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    restart: unless-stopped